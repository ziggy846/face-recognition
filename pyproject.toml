[project]
name = "face-recognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "insightface>=2.1",
    "numpy>=2.5.4",
    "onnxruntime-gpu>=1.31.0",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "ultralytics>=8.4.178",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
